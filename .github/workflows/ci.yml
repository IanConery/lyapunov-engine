name: Lyapunov Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff clang-format

      - name: Check Python Formatting & Linting (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Check C++ Code Formatting (Clang-Format)
        run: |
          find csrc/ -name "*.cu" -o -name "*.cuh" -o -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror

  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      BUILD_CUDA_EXT: "0"
      NO_CUDA: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy transformers accelerate safetensors fastapi uvicorn pydantic gguf

      - name: Install Package (Editable)
        run: |
          pip install --no-build-isolation -e .

      - name: Run CPU Unit Test Suite
        run: |
          pytest tests/test_server_protocol.py tests/test_stability_diagnostics.py tests/test_tensor_parallel.py tests/test_speculative_and_prefix.py -v
